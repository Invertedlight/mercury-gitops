apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "c9b1bfad-34e1-47bd-a096-2ae21da2c9ca"
      - op: replace
        path: /spec/parameters/tenantId
        value: "56064b81-ec30-4395-bb27-af9877c941dc"
